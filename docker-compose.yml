services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./backend/.env
    # The sandbox needs to run Docker containers, so it must mount the host Docker socket
    # Note: On Windows Docker Desktop, this mount path usually translates correctly.
    environment:
      - SANDBOX_SIZE_LIMIT_MB=250

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for live-reloading on Windows host mounts
